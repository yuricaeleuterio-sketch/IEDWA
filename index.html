<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IEDWA - Portal Educacional</title>
<style>
:root{--azul:#0b2a4a;--dourado:#c9a227}
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,Arial}
body{background:#f6f8fb;color:#222}
header{background:var(--azul);color:white;padding:35px 20px;text-align:center;border-bottom:6px solid var(--dourado)}
header h1{font-size:38px;letter-spacing:1px}
.container{max-width:1100px;margin:25px auto;padding:0 15px}
.card{background:white;border-radius:14px;padding:22px;box-shadow:0 6px 18px rgba(0,0,0,.07)}
.search{width:100%;padding:14px;border:2px solid #d9e1ec;border-radius:10px;margin-bottom:18px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.file{border:1px solid #e3e8ef;border-radius:10px;padding:14px;text-decoration:none;color:var(--azul);display:flex;flex-direction:column;gap:6px;background:#fff}
.file b{font-size:15px}
.file span{font-size:13px;color:#666}
.btn{margin-top:6px;background:var(--azul);color:white;padding:8px 12px;border-radius:7px;text-align:center;font-weight:700}
footer{background:var(--azul);color:#b8c6d6;text-align:center;padding:20px;margin-top:30px}
</style>
</head>
<body>
<header>
<h1>IEDWA</h1>
<p>Portal Web Educacional - Guias e Planos Curriculares</p>
</header>
<div class="container">
<input id="busca" class="search" placeholder="🔍 Pesquisar documento..." onkeyup="filtrar()">
<div class="card"><div class="grid" id="lista">A carregar...</div></div>
</div>
<footer>© 2026 IEDWA - Hospedado no GitHub Pages</footer>
<script>
async function load(){
 const r=await fetch('https://api.github.com/repos/yuricaeleuterio-sketch/IEDWA/contents');
 const files=await r.json();
 let h='';
 files.filter(f=>f.type==='file' && f.name!=='index.html').forEach(f=>{
   h+=`<a class="file" href="./${f.name}" target="_blank"><b>📄 ${f.name.replace(/_/g,' ').replace('.pdf','')}</b><span>${f.name}</span><div class="btn">Abrir / Baixar</div></a>`;
 });
 document.getElementById('lista').innerHTML=h;
}
function filtrar(){
 let q=document.getElementById('busca').value.toLowerCase();
 document.querySelectorAll('.file').forEach(el=>{el.style.display=el.innerText.toLowerCase().includes(q)?'flex':'none'});
}
load();
</script>
</body>
</html>
